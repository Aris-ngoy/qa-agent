name: Demo Expo E2E

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which simulator/emulator jobs to run
        type: choice
        options:
          - both
          - ios
          - android
        default: both
  pull_request:
    paths:
      - examples/expo-demo/**
      - packages/cli/**
      - packages/runner-client/**
      - services/runner/**
      - .github/workflows/demo-expo-e2e.yml
  push:
    branches: [main]
    paths:
      - examples/expo-demo/**
      - packages/cli/**
      - packages/runner-client/**
      - services/runner/**
      - .github/workflows/demo-expo-e2e.yml

permissions:
  contents: read

concurrency:
  group: demo-expo-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  YOQA_REPO_ROOT: ${{ github.workspace }}

jobs:
  ios:
    name: iOS Simulator
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'both' || github.event.inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.23

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/expo-demo/package-lock.json

      - name: Install monorepo dependencies
        run: bun install --frozen-lockfile

      - name: Build runner and CLI
        run: |
          bun run --filter @yoqa/runner build
          bun run --filter @yoqa/cli build

      - name: Put workspace yoqa on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/usr/bin/env bash' "exec node \"${GITHUB_WORKSPACE}/packages/cli/dist/main.js\" \"\$@\"" > "$HOME/.local/bin/yoqa"
          chmod +x "$HOME/.local/bin/yoqa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Yoqa Appium runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.yoqa/runtime
          key: yoqa-runtime-${{ runner.os }}-${{ hashFiles('services/runner/package.json') }}
          restore-keys: yoqa-runtime-${{ runner.os }}-

      - name: Install Expo demo dependencies
        working-directory: examples/expo-demo
        run: npm ci

      - name: Start Yoqa runner
        run: |
          yoqa health
          yoqa runtime ensure

      - name: Boot iPhone simulator
        id: sim
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys

          data = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          )
          iphones = []
          for rows in data.get("devices", {}).values():
              for device in rows:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      iphones.append(device)
          chosen = next((d for d in iphones if d["name"].startswith("iPhone 16")), None)
          if chosen is None and iphones:
              chosen = iphones[0]
          if chosen is None:
              sys.exit("No available iPhone simulator")
          udid = chosen["udid"]
          print(f"Using {chosen['name']} ({udid})")
          subprocess.run(["xcrun", "simctl", "boot", udid], check=False)
          subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"udid={udid}\n")
          PY

      - name: Build and install iOS Release
        working-directory: examples/expo-demo
        env:
          RCT_NO_LAUNCH_PACKAGER: "1"
          LANG: en_US.UTF-8
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          npx expo prebuild --platform ios --non-interactive
          (cd ios && pod install)
          xcodebuild \
            -workspace ios/YoqaDemo.xcworkspace \
            -scheme YoqaDemo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$HOME/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES
          APP="$HOME/DerivedData/Build/Products/Release-iphonesimulator/YoqaDemo.app"
          test -d "$APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" ai.yoqa.demo


      - name: Connect Yoqa and smoke
        run: |
          yoqa devices connect "${{ steps.sim.outputs.udid }}" --platform ios --bundle-id ai.yoqa.demo
          bash examples/expo-demo/yoqa/ci-smoke.sh

      - name: Capture failure artifacts
        if: failure()
        run: |
          mkdir -p artifacts
          yoqa screenshot artifacts/ios-failure.png || true
          yoqa screen --json > artifacts/ios-screen.json || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yoqa-expo-demo-ios-failure
          path: artifacts
          if-no-files-found: ignore

  android:
    name: Android Emulator
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'both' || github.event.inputs.platform == 'android'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.23

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/expo-demo/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install monorepo dependencies
        run: bun install --frozen-lockfile

      - name: Build runner and CLI
        run: |
          bun run --filter @yoqa/runner build
          bun run --filter @yoqa/cli build

      - name: Put workspace yoqa on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/usr/bin/env bash' "exec node \"${GITHUB_WORKSPACE}/packages/cli/dist/main.js\" \"\$@\"" > "$HOME/.local/bin/yoqa"
          chmod +x "$HOME/.local/bin/yoqa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Yoqa Appium runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.yoqa/runtime
          key: yoqa-runtime-${{ runner.os }}-${{ hashFiles('services/runner/package.json') }}
          restore-keys: yoqa-runtime-${{ runner.os }}-

      - name: Install Expo demo dependencies
        working-directory: examples/expo-demo
        run: npm ci

      - name: Start Yoqa runner
        run: |
          yoqa health
          yoqa runtime ensure

      - name: Build, install, and smoke on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          script: |
            set -euo pipefail
            SERIAL="$(adb devices | awk 'NR>1 && $2=="device" {print $1; exit}')"
            if [ -z "$SERIAL" ]; then
              echo "No Android emulator serial found"
              exit 1
            fi
            (cd examples/expo-demo && npx expo run:android --variant release --no-bundler --device "$SERIAL")
            yoqa devices connect "$SERIAL" --platform android --app-package ai.yoqa.demo
            bash examples/expo-demo/yoqa/ci-smoke.sh

      - name: Capture failure artifacts
        if: failure()
        run: |
          mkdir -p artifacts
          yoqa screenshot artifacts/android-failure.png || true
          yoqa screen --json > artifacts/android-screen.json || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yoqa-expo-demo-android-failure
          path: artifacts
          if-no-files-found: ignore
