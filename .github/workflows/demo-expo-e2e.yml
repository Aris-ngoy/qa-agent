name: Demo Expo E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - examples/expo-demo/**
      - packages/cli/**
      - packages/runner-client/**
      - services/runner/**
      - .github/workflows/demo-expo-e2e.yml
  push:
    branches: [main]
    paths:
      - examples/expo-demo/**
      - packages/cli/**
      - packages/runner-client/**
      - services/runner/**
      - .github/workflows/demo-expo-e2e.yml

permissions:
  contents: read

concurrency:
  group: demo-expo-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  YOQA_REPO_ROOT: ${{ github.workspace }}

jobs:
  android:
    name: Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.23

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/expo-demo/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install monorepo dependencies
        run: bun install --frozen-lockfile

      - name: Build runner and CLI
        run: |
          bun run --filter @yoqa/runner build
          bun run --filter @yoqa/cli build

      - name: Put workspace yoqa on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/usr/bin/env bash' "exec node \"${GITHUB_WORKSPACE}/packages/cli/dist/main.js\" \"\$@\"" > "$HOME/.local/bin/yoqa"
          chmod +x "$HOME/.local/bin/yoqa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Yoqa Appium runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.yoqa/runtime
          key: yoqa-runtime-${{ runner.os }}-${{ hashFiles('services/runner/package.json') }}
          restore-keys: yoqa-runtime-${{ runner.os }}-

      - name: Install Expo demo dependencies
        working-directory: examples/expo-demo
        run: npm ci

      - name: Start Yoqa runner
        run: |
          yoqa health
          yoqa runtime ensure

      - name: Prebuild Android (Expo CLI)
        working-directory: examples/expo-demo
        run: npx expo prebuild --platform android

      - name: Build, install, and smoke on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # This action runs `script` with /bin/sh (dash on Ubuntu) — no pipefail.
          script: bash examples/expo-demo/yoqa/ci-android.sh

      - name: Capture failure artifacts
        if: failure()
        run: |
          mkdir -p artifacts
          yoqa screenshot artifacts/android-failure.png || true
          yoqa screen --json > artifacts/android-screen.json || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yoqa-expo-demo-android-failure
          path: artifacts
          if-no-files-found: ignore
