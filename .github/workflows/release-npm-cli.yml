name: Release npm CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-npm-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize release
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Restrict to repository owner
        run: |
          if [ "${GITHUB_ACTOR}" != "${GITHUB_REPOSITORY_OWNER}" ]; then
            echo "::error::Only @${GITHUB_REPOSITORY_OWNER} can run the release job (actor was @${GITHUB_ACTOR})."
            exit 1
          fi
          echo "Release allowed for owner @${GITHUB_REPOSITORY_OWNER}."
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

  publish:
    name: Build & publish yoqa to npm
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.23

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run --filter yoqa build

      - name: Smoke CLI
        run: node packages/cli/dist/main.js --version

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
