name: Start Argent tool-server
description: Start Argent's long-lived tool-server and wait until it reports ready.
author: Yoqa
inputs:
  ready-timeout:
    description: Seconds to wait for the tool-server to report running.
    required: false
    default: "60"
runs:
  using: composite
  steps:
    - name: Start Argent tool-server
      shell: bash
      run: |
        set -uo pipefail
        # `argent run` will auto-start the tool-server, but its internal wait is
        # short (~20s) and a cold CI runner can miss it. Every later
        # `yoqa devices connect` then fails with "Timed out waiting for tools
        # server to become ready", so start it detached and poll until ready.
        argent server start --detach || true

        deadline=$(( SECONDS + ${{ inputs.ready-timeout }} ))
        while [ "$SECONDS" -lt "$deadline" ]; do
          if argent server status --json 2>/dev/null | tr -d ' \n' | grep -q '"running":true'; then
            echo "Argent tool-server ready"
            argent server status --json
            exit 0
          fi
          sleep 2
        done

        echo "Argent tool-server did not become ready within ${{ inputs.ready-timeout }}s" >&2
        echo "--- argent server logs (tail) ---" >&2
        argent server logs 2>&1 | tail -50 >&2 || true
        exit 1
