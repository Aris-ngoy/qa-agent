version: 1
name: Expo demo smoke
actions:
  - assert: { text: Yoqa Demo, timeoutMs: 60000, reason: Home screen is visible }
  - tap: { label: Increment, reason: Increment the counter }
  - assert: { text: "Count: 1", timeoutMs: 15000, reason: Counter shows 1 }
  - tap: { label: Open greeting, reason: Open the greeting screen }
  - tap: { label: Name, reason: Focus the name field }
  - type: { text: Ada, reason: Type Ada }
  - tap: { label: Submit, reason: Submit the greeting }
  - assert: { text: "Hello, Ada", timeoutMs: 15000, reason: "Greeting shows Hello, Ada" }
